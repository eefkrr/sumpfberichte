name: Update Feeds & Deploy Pages

on:
  schedule:
    # Stündlich um :15 (UTC)
    - cron: '15 * * * *'
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-feeds'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code-Branch (main) auschecken
        uses: actions/checkout@v4

      - name: Vorherige Feed-Daten aus Branch feeds-data laden
        run: |
          if git ls-remote --exit-code --heads origin feeds-data >/dev/null 2>&1; then
            git fetch origin feeds-data:feeds-data
            mkdir -p logs
            git show feeds-data:feeds_berlin.json > feeds_berlin.json 2>/dev/null || true
            git show feeds-data:feeds_mitte.json > feeds_mitte.json 2>/dev/null || true
            git show feeds-data:logs/feed_status.json > logs/feed_status.json 2>/dev/null || true
          else
            echo "Branch feeds-data existiert noch nicht – starte Erstbefüllung."
          fi

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, xml, mbstring, iconv
          coverage: none

      - name: Feeds abrufen und akkumulieren
        run: php fetchFeedsWithProxy.php

      - name: Feed-Status in Job Summary schreiben
        if: always()
        run: php fetchFeedsWithProxy.php --summary-md >> "$GITHUB_STEP_SUMMARY"

      - name: Aktualisierte Feed-Daten auf Branch feeds-data speichern
        run: |
          DATA_DIR=$(mktemp -d)
          mkdir -p "$DATA_DIR/logs"
          cp feeds_berlin.json feeds_mitte.json "$DATA_DIR/"
          cp logs/feed_status.json "$DATA_DIR/logs/"

          if git show-ref --verify --quiet refs/heads/feeds-data; then
            git worktree add "$DATA_DIR/wt" feeds-data
          else
            git worktree add --orphan -b feeds-data "$DATA_DIR/wt"
          fi

          mkdir -p "$DATA_DIR/wt/logs"
          cp "$DATA_DIR/feeds_berlin.json" "$DATA_DIR/feeds_mitte.json" "$DATA_DIR/wt/"
          cp "$DATA_DIR/logs/feed_status.json" "$DATA_DIR/wt/logs/"

          cd "$DATA_DIR/wt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds_berlin.json feeds_mitte.json logs/feed_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update feeds"
            git push origin feeds-data
          else
            echo "Keine Änderungen an den Feeds."
          fi

      - name: Statisches Pages-Paket (_site) bauen
        run: |
          mkdir -p _site
          cp index.html styles.css rss-feeds.js robots.txt \
             favicon.ico favicon.svg favicon-128x128.png \
             feeds_berlin.json feeds_mitte.json _site/
          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
