name: Update Feeds & Deploy Pages

on:
  schedule:
    # Stündlich um :15 (UTC)
    - cron: '15 * * * *'
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages-and-feeds'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Code-Branch (main) auschecken
        uses: actions/checkout@v5

      - name: Vorherige Feed-Daten aus Branch feeds-data laden
        run: |
          if git ls-remote --exit-code --heads origin feeds-data >/dev/null 2>&1; then
            git fetch --depth=1 origin feeds-data:feeds-data
            mkdir -p logs
            git show feeds-data:feeds_berlin.json > feeds_berlin.json 2>/dev/null || true
            git show feeds-data:feeds_mitte.json > feeds_mitte.json 2>/dev/null || true
            git show feeds-data:logs/feed_status.json > logs/feed_status.json 2>/dev/null || true
          else
            echo "Branch feeds-data existiert noch nicht – starte Erstbefüllung."
          fi

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, xml, mbstring, iconv
          coverage: none

      - name: Feeds abrufen und akkumulieren
        run: php fetchFeedsWithProxy.php

      - name: Feed-Status in Job Summary schreiben
        if: always()
        run: php fetchFeedsWithProxy.php --summary-md >> "$GITHUB_STEP_SUMMARY"

      - name: Aktualisierte Feed-Daten schlank auf Branch feeds-data speichern
        run: |
          DATA_DIR=$(mktemp -d)
          mkdir -p "$DATA_DIR/data/logs"
          cp feeds_berlin.json feeds_mitte.json "$DATA_DIR/data/"
          cp logs/feed_status.json "$DATA_DIR/data/logs/"

          # Immer als einzelner Orphan-Commit speichern, damit das Repo dauerhaft klein bleibt
          git worktree add --detach "$DATA_DIR/wt"
          cd "$DATA_DIR/wt"
          git checkout --orphan feeds-data-next
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p logs
          cp "$DATA_DIR/data/feeds_berlin.json" "$DATA_DIR/data/feeds_mitte.json" ./
          cp "$DATA_DIR/data/logs/feed_status.json" ./logs/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f feeds_berlin.json feeds_mitte.json logs/feed_status.json
          git commit -m "chore: update feeds"
          git push --force origin HEAD:refs/heads/feeds-data

      - name: Statisches Pages-Paket (_site) bauen
        run: |
          mkdir -p _site
          cp index.html styles.css rss-feeds.js robots.txt \
             favicon.ico favicon.svg favicon-128x128.png \
             feeds_berlin.json feeds_mitte.json _site/
          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
