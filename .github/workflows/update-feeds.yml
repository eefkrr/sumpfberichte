name: Update Feeds & Deploy Pages

on:
  schedule:
    # Stündlich um :15 (UTC) – auf GitHub Actions zuverlässig & kostenlos
    - cron: '15 * * * *'
  push:
    branches: ['main']
    paths-ignore:
      - 'feeds_berlin.json'
      - 'feeds_mitte.json'
      - 'logs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-feeds'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, xml, mbstring, iconv
          coverage: none

      - name: Feeds abrufen und akkumulieren
        run: php fetchFeedsWithProxy.php

      - name: Feed-Status in Job Summary schreiben
        if: always()
        run: php fetchFeedsWithProxy.php --summary-md >> "$GITHUB_STEP_SUMMARY"

      - name: Aktualisierte Feeds & Status-Log committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds_berlin.json feeds_mitte.json logs/feed_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update feeds [skip ci]"
            git push
          else
            echo "Keine Änderungen an den Feeds."
          fi

      - name: Statisches Pages-Paket (_site) bauen
        run: |
          mkdir -p _site
          cp index.html styles.css rss-feeds.js robots.txt \
             favicon.ico favicon.svg favicon-128x128.png \
             feeds_berlin.json feeds_mitte.json _site/
          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
